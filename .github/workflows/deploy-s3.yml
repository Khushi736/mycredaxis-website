# Deploy mycredaxis.com static build to S3 (+ optional CloudFront invalidation).
#
# Required GitHub repo secrets:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_S3_BUCKET, AWS_REGION
# Optional:
#   AWS_CLOUDFRONT_DISTRIBUTION_ID
#
# S3 static website hosting: Index + Error document = index.html
# CloudFront (if used): custom error 403/404 → /index.html, response 200

name: Deploy to AWS S3

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-s3
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Audit routes (no hash links in source)
        run: node scripts/audit-routes.mjs

      - name: Verify SPA routing bundle
        run: node scripts/verify-spa-build.mjs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync assets to S3
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: |
          aws s3 sync dist/ "s3://${AWS_S3_BUCKET}/" --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload index.html (no long cache)
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: |
          aws s3 cp dist/index.html "s3://${AWS_S3_BUCKET}/index.html" \
            --cache-control "public,max-age=0,must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        env:
          AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -n "${AWS_CLOUDFRONT_DISTRIBUTION_ID}" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "${AWS_CLOUDFRONT_DISTRIBUTION_ID}" \
              --paths "/*"
          else
            echo "Skipping CloudFront invalidation (AWS_CLOUDFRONT_DISTRIBUTION_ID not set)."
          fi
